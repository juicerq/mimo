<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mimo</title>
<style>
:root {
	color-scheme: dark;
	--bg: #15171c;
	--rail: #111317;
	--sheet: #1b1e24;
	--raise: #21252c;
	--rule: #2d313a;
	--rule-soft: #23272e;
	--ink: #efede8;
	--text: #cbcbc7;
	--muted: #8f949e;
	--faint: #646a75;
	--accent: #a0b4f5;
	--amber: #e3b35f;
	--rose: #ee868e;
	--mint: #8cc7a4;
	--sans: system-ui, -apple-system, "Segoe UI", Cantarell, "Noto Sans", sans-serif;
	--mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", "DejaVu Sans Mono", monospace;
	--col: 720px;
	--rail-w: 60px;
	--mark: 36px;
}

* {
	box-sizing: border-box;
}

html,
body {
	margin: 0;
	height: 100%;
}

body {
	overflow: hidden;
	background: var(--bg);
	color: var(--text);
	font: 15px/1.6 var(--sans);
	-webkit-font-smoothing: antialiased;
}

button,
input,
textarea {
	font: inherit;
	color: inherit;
}

button {
	padding: 0;
	border: 0;
	background: none;
	cursor: pointer;
}

p {
	margin: 0;
}

code,
pre,
kbd {
	font-family: var(--mono);
}

:focus-visible {
	outline: 2px solid color-mix(in srgb, var(--accent) 70%, transparent);
	outline-offset: 2px;
	border-radius: 6px;
}

svg {
	display: block;
	flex: none;
}

.app {
	display: grid;
	grid-template-columns: var(--rail-w) minmax(0, 1fr);
	height: 100vh;
}

.rail {
	position: relative;
	z-index: 20;
}

.rail-panel {
	position: absolute;
	inset: 0 auto 0 0;
	display: flex;
	flex-direction: column;
	width: var(--rail-w);
	overflow: hidden;
	background: var(--rail);
	border-right: 1px solid var(--rule-soft);
	transition: width 0.18s ease, box-shadow 0.18s ease;
}

.rail.open .rail-panel {
	width: 276px;
	box-shadow: 30px 0 60px -30px rgb(0 0 0 / 0.75);
}

.rail-list {
	display: flex;
	flex: 1;
	flex-direction: column;
	gap: 4px;
	min-height: 0;
	padding: 14px 0 8px;
	overflow: hidden auto;
	scrollbar-width: none;
}

.bot-item {
	display: grid;
	grid-template-columns: var(--mark) minmax(0, 1fr);
	align-items: center;
	gap: 12px;
	width: 100%;
	padding: 5px calc((var(--rail-w) - var(--mark)) / 2);
	text-align: left;
}

.rail.open .bot-item:hover {
	background: rgb(255 255 255 / 0.03);
}

.bot-item:focus-visible {
	outline-offset: -2px;
	border-radius: 0;
}

.mark {
	position: relative;
	display: grid;
	place-items: center;
	width: var(--mark);
	height: var(--mark);
	border-radius: 11px;
	background: var(--raise);
	color: var(--muted);
	font-size: 13.5px;
	font-weight: 650;
	letter-spacing: 0.01em;
	transition: background 0.15s, color 0.15s;
}

.bot-item:hover .mark {
	color: var(--ink);
}

.bot-item[aria-current="true"] .mark {
	background: var(--ink);
	color: var(--bg);
}

.dot {
	position: absolute;
	right: -3px;
	bottom: -3px;
	display: none;
	width: 11px;
	height: 11px;
	border: 2px solid var(--rail);
	border-radius: 50%;
}

.dot[data-state="working"] {
	display: block;
	background: var(--accent);
}

.dot[data-state="waiting"] {
	display: block;
	background: var(--amber);
}

.dot[data-state="failed"] {
	display: block;
	background: var(--rose);
}

.dot[data-state="working"]::after,
.beacon[data-turn="working"]::after,
.beacon[data-turn="responding"]::after,
.beacon.small::after {
	content: "";
	position: absolute;
	inset: -4px;
	border: 1px solid var(--accent);
	border-radius: 50%;
	animation: ring 1.8s ease-out infinite;
}

@keyframes ring {
	from {
		opacity: 0.9;
		transform: scale(0.5);
	}
	to {
		opacity: 0;
		transform: scale(1.5);
	}
}

.bot-text {
	min-width: 0;
	opacity: 0;
	transition: opacity 0.1s;
}

.rail.open .bot-text {
	opacity: 1;
	transition-delay: 0.07s;
}

.bot-line {
	display: flex;
	align-items: baseline;
	justify-content: space-between;
	gap: 8px;
}

.bot-name-text {
	overflow: hidden;
	color: var(--ink);
	font-size: 14px;
	font-weight: 550;
	white-space: nowrap;
	text-overflow: ellipsis;
}

.bot-time {
	flex: none;
	color: var(--faint);
	font-size: 12px;
	font-variant-numeric: tabular-nums;
}

.bot-sub {
	display: block;
	overflow: hidden;
	color: var(--muted);
	font-size: 12.5px;
	line-height: 1.4;
	white-space: nowrap;
	text-overflow: ellipsis;
}

.bot-sub[data-state="working"] {
	color: var(--accent);
}

.bot-sub[data-state="waiting"] {
	color: var(--amber);
}

.bot-sub[data-state="failed"] {
	color: var(--rose);
}

.rail-foot {
	padding: 8px 0 12px;
	border-top: 1px solid var(--rule-soft);
}

.mark.plus {
	border: 1px dashed var(--rule);
	background: none;
	color: var(--muted);
	font-size: 18px;
	font-weight: 400;
}

.rail-keys {
	width: 276px;
	padding: 8px 12px 0 calc(var(--rail-w) + 0px);
	color: var(--faint);
	font-size: 12px;
	white-space: nowrap;
	opacity: 0;
}

.rail.open .rail-keys {
	opacity: 1;
}

.create {
	width: 276px;
	padding: 4px 12px 6px;
}

.create input {
	width: 100%;
	padding: 8px 10px;
	border: 1px solid var(--rule);
	border-radius: 10px;
	outline: none;
	background: var(--raise);
	color: var(--ink);
	font-size: 14px;
}

.create input:focus {
	border-color: color-mix(in srgb, var(--accent) 50%, var(--rule));
}

.create-hint {
	padding: 6px 2px 0;
	color: var(--faint);
	font-size: 12px;
}

.create-hint.bad {
	color: var(--rose);
}

.stage {
	position: relative;
	display: grid;
	grid-template-rows: auto minmax(0, 1fr) auto;
	min-width: 0;
	height: 100vh;
}

.top {
	position: relative;
	z-index: 10;
}

.top-inner,
.column,
.dock-inner {
	max-width: calc(var(--col) + 48px);
	margin: 0 auto;
}

.top-inner {
	position: relative;
	display: flex;
	align-items: center;
	gap: 12px;
	padding: 12px 24px 4px;
}

#sheetHost {
	display: contents;
}

.bot-name {
	display: inline-flex;
	flex: none;
	align-items: center;
	gap: 6px;
	margin-left: -9px;
	padding: 5px 9px;
	border-radius: 9px;
	color: var(--ink);
	font-size: 15px;
	font-weight: 650;
}

.bot-name:hover,
.bot-name[aria-expanded="true"] {
	background: var(--raise);
}

.bot-name svg {
	color: var(--muted);
	transition: transform 0.15s;
}

.bot-name[aria-expanded="true"] svg {
	transform: rotate(180deg);
}

.meta {
	display: flex;
	gap: 12px;
	min-width: 0;
	overflow: hidden;
	color: var(--muted);
	font-size: 13px;
	white-space: nowrap;
}

.meta span {
	overflow: hidden;
	text-overflow: ellipsis;
}

.detail-btn {
	display: inline-flex;
	flex: none;
	align-items: center;
	gap: 9px;
	margin: 0 -9px 0 auto;
	padding: 5px 9px;
	border-radius: 9px;
	color: var(--muted);
	font-size: 13px;
	white-space: nowrap;
}

.detail-btn:hover {
	background: var(--raise);
	color: var(--text);
}

.detail-btn b {
	color: var(--text);
	font-weight: 550;
}

.levels {
	display: inline-flex;
	align-items: flex-end;
	gap: 2px;
	height: 11px;
}

.levels i {
	width: 3px;
	border-radius: 1px;
	background: var(--rule);
}

.levels i:nth-child(1) {
	height: 5px;
}

.levels i:nth-child(2) {
	height: 8px;
}

.levels i:nth-child(3) {
	height: 11px;
}

.levels i.on {
	background: var(--text);
}

.scroll {
	overflow-y: auto;
	scrollbar-gutter: stable both-edges;
	scrollbar-width: thin;
	scrollbar-color: var(--rule) transparent;
	mask-image: linear-gradient(transparent, #000 18px, #000 calc(100% - 22px), transparent);
}

.column {
	padding: 28px 24px 36px;
}

.column > :first-child {
	margin-top: 0;
}

.you {
	margin: 46px 0 14px;
	color: var(--ink);
	font-size: 19px;
	font-weight: 600;
	line-height: 1.42;
	letter-spacing: -0.012em;
	white-space: pre-wrap;
	overflow-wrap: anywhere;
	text-wrap: pretty;
}

.reply {
	margin: 12px 0;
	color: var(--text);
	font-size: 15.5px;
	line-height: 1.7;
	text-wrap: pretty;
}

.reply > :first-child {
	margin-top: 0;
}

.reply > :last-child {
	margin-bottom: 0;
}

.reply p {
	margin: 0 0 0.75em;
}

.reply strong {
	color: var(--ink);
	font-weight: 600;
}

.reply h2 {
	margin: 1.3em 0 0.35em;
	color: var(--ink);
	font-size: 15.5px;
	font-weight: 700;
	letter-spacing: 0.005em;
}

.reply ul,
.reply ol {
	margin: 0 0 0.85em;
	padding-left: 1.25em;
}

.reply li {
	margin: 0.25em 0;
	padding-left: 0.2em;
}

.reply li::marker {
	color: var(--faint);
}

.reply code {
	padding: 0.12em 0.4em;
	border-radius: 5px;
	background: var(--raise);
	color: var(--ink);
	font-size: 0.85em;
}

.reply pre {
	margin: 0 0 0.9em;
	padding: 12px 14px;
	overflow-x: auto;
	border: 1px solid var(--rule-soft);
	border-radius: 10px;
	background: var(--sheet);
	font-size: 13px;
	line-height: 1.6;
}

.reply pre code {
	padding: 0;
	background: none;
	color: var(--text);
	font-size: inherit;
}

.reply table {
	margin: 0.2em 0 1em;
	border-collapse: collapse;
	font-size: 14px;
	font-variant-numeric: tabular-nums;
}

.reply th {
	padding: 0 24px 6px 0;
	border-bottom: 1px solid var(--rule);
	color: var(--muted);
	font-size: 13px;
	font-weight: 600;
	text-align: left;
}

.reply td {
	padding: 7px 24px 7px 0;
	border-bottom: 1px solid var(--rule-soft);
}

.reply tr:last-child td {
	border-bottom: 0;
}

.reply blockquote {
	margin: 0 0 0.9em;
	padding: 1px 0 1px 16px;
	border-left: 2px solid color-mix(in srgb, var(--accent) 50%, transparent);
	color: var(--muted);
}

.reply a {
	color: var(--accent);
	text-decoration: underline;
	text-decoration-color: color-mix(in srgb, var(--accent) 40%, transparent);
	text-underline-offset: 3px;
}

.reply a:hover {
	text-decoration-color: var(--accent);
}

.reply.streaming > :last-child {
	animation: fresh 0.35s ease-out;
}

@keyframes fresh {
	from {
		opacity: 0;
	}
}

.fold {
	display: inline-flex;
	align-items: center;
	gap: 8px;
	max-width: calc(100% + 16px);
	margin: 0 0 0 -9px;
	padding: 3px 9px;
	border-radius: 8px;
	color: var(--muted);
	font-size: 13.5px;
	text-align: left;
}

button.fold:hover {
	background: var(--raise);
	color: var(--text);
}

.fold code {
	color: var(--text);
	font-size: 12.5px;
}

.fold b {
	color: var(--text);
	font-weight: 600;
}

.fold .bad {
	color: var(--rose);
}

.chev {
	color: var(--faint);
	transition: transform 0.15s;
}

[aria-expanded="true"] > .chev {
	transform: rotate(90deg);
}

.group {
	margin: 10px 0;
}

.steps {
	display: flex;
	flex-direction: column;
	gap: 7px;
	margin: 6px 0 14px 1px;
	padding: 3px 0 3px 18px;
	border-left: 1px solid var(--rule);
	font-size: 13.5px;
}

.step-head {
	display: flex;
	align-items: center;
	gap: 9px;
	min-width: 0;
}

.glyph {
	display: grid;
	flex: none;
	place-items: center;
	width: 12px;
	height: 12px;
	color: var(--faint);
}

.glyph.ok {
	color: var(--mint);
}

.glyph.bad {
	color: var(--rose);
}

.glyph.wait {
	color: var(--amber);
}

.spin {
	width: 10px;
	height: 10px;
	border: 1.5px solid var(--rule);
	border-top-color: var(--accent);
	border-radius: 50%;
	animation: spin 0.9s linear infinite;
}

@keyframes spin {
	to {
		transform: rotate(360deg);
	}
}

.tname {
	flex: none;
	color: var(--ink);
	font-size: 12.5px;
}

.peek {
	flex: 1;
	min-width: 0;
	overflow: hidden;
	color: var(--faint);
	font-family: var(--mono);
	font-size: 12px;
	white-space: nowrap;
	text-overflow: ellipsis;
}

.st {
	flex: none;
	margin-left: auto;
	color: var(--faint);
	font-size: 12.5px;
}

.st.bad {
	color: var(--rose);
}

.st.wait {
	color: var(--amber);
}

.step-team {
	display: flex;
	align-items: center;
	gap: 9px;
	color: var(--muted);
}

.step-team b {
	color: var(--text);
	font-weight: 600;
}

.step .fail {
	margin: 3px 0 0 21px;
	color: var(--rose);
	font-size: 13px;
}

.kv {
	display: grid;
	grid-template-columns: max-content minmax(0, 1fr);
	gap: 3px 14px;
	margin: 6px 0 0 21px;
	font-family: var(--mono);
	font-size: 12px;
	line-height: 1.55;
}

.kv dt {
	color: var(--faint);
}

.kv dd {
	margin: 0;
	color: var(--text);
	white-space: pre-wrap;
	overflow-wrap: anywhere;
}

.result {
	max-height: 210px;
	margin: 6px 0 0 21px;
	padding: 8px 11px;
	overflow: auto;
	border: 1px solid var(--rule-soft);
	border-radius: 8px;
	background: var(--sheet);
	color: var(--text);
	font-size: 12px;
	line-height: 1.6;
	white-space: pre-wrap;
	overflow-wrap: anywhere;
}

.chip {
	display: inline-grid;
	flex: none;
	place-items: center;
	width: 20px;
	height: 20px;
	border-radius: 6px;
	background: var(--raise);
	color: var(--muted);
	font-size: 11px;
	font-weight: 700;
}

.note {
	margin: 16px 0;
}

.note .fold {
	gap: 10px;
	color: var(--text);
	font-size: 14px;
}

.note-body {
	margin: 6px 0 4px 20px;
	padding: 1px 0 1px 16px;
	border-left: 2px solid var(--rule);
	color: var(--text);
	font-size: 14.5px;
	white-space: pre-wrap;
}

.summary {
	margin: 0 0 22px;
}

.divider {
	display: flex;
	align-items: center;
	gap: 12px;
	width: 100%;
	padding: 4px 0;
	color: var(--faint);
	font-size: 13px;
}

.divider::before,
.divider::after {
	content: "";
	flex: 1;
	height: 1px;
	background: var(--rule-soft);
}

.divider:hover {
	color: var(--text);
}

.summary-text {
	margin: 10px 0 0;
	padding: 1px 0 1px 16px;
	border-left: 2px solid var(--rule);
	color: var(--muted);
	font-size: 14.5px;
	line-height: 1.65;
}

.routine {
	margin: 46px 0 8px;
}

.routine-prompt {
	margin: 8px 0 0;
	padding: 1px 0 1px 16px;
	border-left: 2px solid var(--rule);
	color: var(--muted);
	font-size: 14.5px;
}

.warn {
	display: flex;
	gap: 10px;
	align-items: baseline;
	margin: 14px 0;
	color: var(--amber);
	font-size: 14px;
}

.warn svg {
	transform: translateY(2px);
}

.err {
	margin: 16px 0;
	padding: 12px 14px;
	border: 1px solid color-mix(in srgb, var(--rose) 24%, transparent);
	border-radius: 12px;
	background: color-mix(in srgb, var(--rose) 7%, transparent);
}

.err-title {
	color: var(--rose);
	font-size: 14px;
	font-weight: 600;
}

.err-msg {
	margin-top: 4px;
	color: var(--text);
	font-family: var(--mono);
	font-size: 12.5px;
	overflow-wrap: anywhere;
}

.err-hint {
	margin-top: 8px;
	color: var(--muted);
	font-size: 13px;
}

.stopped {
	margin: 12px 0;
	color: var(--muted);
	font-size: 14px;
	font-style: italic;
}

.live {
	margin: 18px 0 8px;
}

.live-row {
	display: flex;
	align-items: center;
	gap: 10px;
	min-width: 0;
}

.live .fold {
	gap: 9px;
	min-width: 0;
	color: var(--text);
	font-size: 14px;
}

.live .fold > span:not(.beacon) {
	overflow: hidden;
	white-space: nowrap;
	text-overflow: ellipsis;
}

.beacon {
	position: relative;
	flex: none;
	width: 8px;
	height: 8px;
	border-radius: 50%;
	background: var(--accent);
}

.beacon[data-turn="thinking"] {
	animation: breathe 1.4s ease-in-out infinite;
}

.beacon[data-turn="waiting"] {
	background: var(--amber);
}

.beacon.small {
	width: 6px;
	height: 6px;
}

@keyframes breathe {
	50% {
		opacity: 0.3;
	}
}

.timer {
	flex: none;
	color: var(--faint);
	font-variant-numeric: tabular-nums;
}

.stop {
	display: inline-flex;
	flex: none;
	align-items: center;
	gap: 7px;
	margin-left: auto;
	padding: 3px 11px;
	border: 1px solid var(--rule);
	border-radius: 999px;
	color: var(--muted);
	font-size: 12.5px;
	white-space: nowrap;
}

.stop::before {
	content: "";
	width: 7px;
	height: 7px;
	border-radius: 2px;
	background: currentColor;
}

.stop:hover,
.stop.armed {
	border-color: color-mix(in srgb, var(--rose) 45%, transparent);
	color: var(--rose);
}

.crew {
	display: grid;
	gap: 7px;
	margin: 14px 0 6px;
	font-size: 13.5px;
}

.crew-title {
	color: var(--faint);
	font-size: 12.5px;
}

.crew-row {
	display: grid;
	grid-template-columns: 20px auto minmax(0, 1fr) auto;
	align-items: center;
	gap: 10px;
}

.crew-row b {
	color: var(--text);
	font-weight: 600;
}

.crew-task {
	overflow: hidden;
	color: var(--muted);
	white-space: nowrap;
	text-overflow: ellipsis;
}

.crew-st {
	display: inline-flex;
	align-items: center;
	gap: 7px;
	color: var(--faint);
	font-size: 12.5px;
	white-space: nowrap;
}

.crew-st code {
	color: var(--text);
	font-size: 12px;
}

.crew-st.done {
	color: var(--mint);
}

.empty {
	max-width: 480px;
	padding: 5vh 0 12px;
}

.empty-mark {
	display: grid;
	place-items: center;
	width: 52px;
	height: 52px;
	border-radius: 16px;
	background: var(--raise);
	color: var(--ink);
	font-size: 19px;
	font-weight: 650;
}

.empty h1 {
	margin: 18px 0 4px;
	color: var(--ink);
	font-size: 23px;
	font-weight: 650;
	letter-spacing: -0.015em;
}

.empty-lead {
	margin-bottom: 26px;
	color: var(--muted);
}

.empty-sub {
	margin-bottom: 10px;
	color: var(--faint);
	font-size: 13px;
}

.can {
	display: grid;
	gap: 7px;
	margin: 0 0 24px;
	padding: 0;
	list-style: none;
}

.can li {
	display: grid;
	grid-template-columns: 112px 1fr;
	gap: 12px;
	font-size: 14px;
}

.can li span:first-child {
	color: var(--ink);
}

.can li span:last-child {
	color: var(--muted);
}

.empty-mode {
	color: var(--muted);
	font-size: 13.5px;
}

.link {
	color: var(--accent);
	font-size: inherit;
	text-decoration: underline;
	text-decoration-color: color-mix(in srgb, var(--accent) 35%, transparent);
	text-underline-offset: 3px;
}

.dock-inner {
	padding: 0 10px 16px;
}

.approval {
	margin-bottom: 10px;
	padding: 14px 16px 14px;
	border: 1px solid color-mix(in srgb, var(--amber) 32%, var(--rule));
	border-radius: 16px;
	background: var(--sheet);
	box-shadow: 0 20px 44px -20px rgb(0 0 0 / 0.85);
	animation: rise 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
}

@keyframes rise {
	from {
		opacity: 0;
		transform: translateY(16px);
	}
}

.approval-head {
	display: flex;
	align-items: center;
	gap: 10px;
	color: var(--ink);
	font-size: 14.5px;
}

.approval-head code {
	font-size: 13px;
}

.approval-head svg {
	color: var(--amber);
}

.approval .kv {
	max-height: 30vh;
	margin: 10px 0 0;
	padding: 10px 12px;
	overflow: auto;
	border-radius: 10px;
	background: var(--bg);
	font-size: 12.5px;
}

.actions {
	display: flex;
	gap: 8px;
	margin-top: 12px;
}

.btn {
	display: inline-flex;
	align-items: center;
	gap: 10px;
	padding: 6px 10px 6px 14px;
	border-radius: 10px;
	font-size: 14px;
	font-weight: 550;
}

.btn kbd {
	padding: 0 5px;
	border: 1px solid currentColor;
	border-radius: 5px;
	font-size: 11px;
	opacity: 0.55;
}

.btn.primary {
	background: var(--ink);
	color: var(--bg);
}

.btn.primary:hover {
	background: #fff;
}

.btn.ghost {
	border: 1px solid var(--rule);
	color: var(--text);
}

.btn.ghost:hover {
	border-color: var(--muted);
}

.composer {
	padding: 12px 14px 10px;
	border: 1px solid var(--rule);
	border-radius: 16px;
	background: var(--raise);
	box-shadow: 0 18px 40px -22px rgb(0 0 0 / 0.95);
	cursor: text;
}

.composer:focus-within {
	border-color: color-mix(in srgb, var(--accent) 32%, var(--rule));
}

.queue {
	display: grid;
	gap: 5px;
	margin-bottom: 10px;
	padding-bottom: 10px;
	border-bottom: 1px solid var(--rule-soft);
	cursor: default;
}

.queue:empty {
	display: none;
}

.queued {
	display: flex;
	align-items: baseline;
	gap: 10px;
	font-size: 14px;
}

.queued .ql {
	flex: none;
	color: var(--faint);
	font-size: 12.5px;
}

.queued p {
	flex: 1;
	min-width: 0;
	overflow: hidden;
	color: var(--text);
	white-space: nowrap;
	text-overflow: ellipsis;
}

.queued button {
	flex: none;
	color: var(--faint);
	font-size: 12.5px;
}

.queued button:hover {
	color: var(--rose);
}

textarea {
	display: block;
	width: 100%;
	max-height: 30vh;
	padding: 0;
	border: 0;
	outline: none;
	background: none;
	color: var(--ink);
	font-size: 15px;
	line-height: 1.5;
	resize: none;
}

textarea:focus-visible {
	outline: none;
}

textarea::placeholder {
	color: var(--faint);
}

.composer-row {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 12px;
	margin-top: 8px;
}

.hint {
	color: var(--faint);
	font-size: 12px;
}

.send {
	display: grid;
	flex: none;
	place-items: center;
	width: 30px;
	height: 30px;
	margin-left: auto;
	border-radius: 50%;
	background: var(--ink);
	color: var(--bg);
}

.send:disabled {
	background: var(--rule);
	color: var(--faint);
	cursor: default;
}

.sheet {
	position: absolute;
	top: calc(100% + 2px);
	left: 15px;
	z-index: 30;
	width: min(400px, calc(100% - 30px));
	max-height: calc(100vh - 80px);
	overflow: auto;
	border: 1px solid var(--rule);
	border-radius: 14px;
	background: var(--sheet);
	box-shadow: 0 30px 70px -24px rgb(0 0 0 / 0.9);
	scrollbar-width: thin;
	scrollbar-color: var(--rule) transparent;
}

.sheet.entering {
	animation: drop 0.16s ease-out;
}

@keyframes drop {
	from {
		opacity: 0;
		transform: translateY(-6px);
	}
}

.sheet-head {
	display: flex;
	align-items: center;
	justify-content: space-between;
	padding: 14px 18px 12px;
}

.sheet-title {
	color: var(--ink);
	font-size: 14.5px;
	font-weight: 650;
}

.icon-btn {
	display: grid;
	place-items: center;
	width: 26px;
	height: 26px;
	border-radius: 7px;
	color: var(--muted);
}

.icon-btn:hover {
	background: var(--raise);
	color: var(--ink);
}

.sheet section {
	padding: 12px 18px 14px;
	border-top: 1px solid var(--rule-soft);
}

.sheet h3 {
	margin: 0 0 8px;
	color: var(--muted);
	font-size: 12.5px;
	font-weight: 600;
}

.opt,
.toggle {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 12px;
	width: calc(100% + 20px);
	margin: 0 -10px;
	padding: 6px 10px;
	border-radius: 8px;
	color: var(--text);
	font-size: 14px;
	text-align: left;
}

.opt:hover,
.toggle:hover {
	background: var(--raise);
}

.opt[aria-checked="true"] {
	color: var(--ink);
	font-weight: 550;
}

.opt svg {
	color: var(--accent);
}

.row {
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 12px;
	margin-top: 10px;
	font-size: 14px;
}

.seg {
	display: inline-flex;
	padding: 2px;
	border: 1px solid var(--rule);
	border-radius: 9px;
	background: var(--bg);
}

.seg button {
	padding: 3px 11px;
	border-radius: 7px;
	color: var(--muted);
	font-size: 13px;
}

.seg button:hover {
	color: var(--text);
}

.seg button[aria-pressed="true"] {
	background: var(--raise);
	color: var(--ink);
}

.explain {
	margin-top: 8px;
	color: var(--muted);
	font-size: 13px;
}

.tg-text {
	display: flex;
	flex-direction: column;
	line-height: 1.35;
}

.tg-hint {
	color: var(--faint);
	font-size: 12.5px;
}

.switch {
	position: relative;
	flex: none;
	width: 30px;
	height: 18px;
	border-radius: 999px;
	background: var(--rule);
	transition: background 0.15s;
}

.switch::after {
	content: "";
	position: absolute;
	top: 2px;
	left: 2px;
	width: 14px;
	height: 14px;
	border-radius: 50%;
	background: var(--muted);
	transition: transform 0.15s, background 0.15s;
}

[aria-checked="true"] > .switch {
	background: color-mix(in srgb, var(--accent) 50%, var(--rule));
}

[aria-checked="true"] > .switch::after {
	background: var(--ink);
	transform: translateX(12px);
}

.folder {
	display: flex;
	flex-wrap: wrap;
	align-items: center;
	gap: 10px;
	font-size: 13.5px;
}

.path {
	padding: 3px 7px;
	border-radius: 6px;
	background: var(--raise);
	color: var(--ink);
	font-size: 12.5px;
	overflow-wrap: anywhere;
}

.field {
	width: 100%;
	padding: 6px 9px;
	border: 1px solid var(--rule);
	border-radius: 8px;
	outline: none;
	background: var(--bg);
	color: var(--ink);
	font-family: var(--mono);
	font-size: 13px;
}

.field:focus {
	border-color: color-mix(in srgb, var(--accent) 50%, var(--rule));
}

.memory {
	color: var(--text);
	font-size: 14px;
}

.memory span {
	display: block;
	margin-top: 2px;
	color: var(--faint);
	font-size: 12.5px;
}

@media (max-width: 760px) {
	:root {
		--rail-w: 52px;
		--mark: 32px;
	}

	.meta,
	.hint {
		display: none;
	}

	.top-inner {
		padding: 8px 16px 2px;
	}

	.column {
		padding: 20px 16px 28px;
	}

	.dock-inner {
		padding: 0 6px 10px;
	}

	.you,
	.routine {
		margin-top: 34px;
		font-size: 17.5px;
	}

	.reply {
		font-size: 15px;
	}

	.sheet {
		position: fixed;
		top: 8px;
		right: 8px;
		left: calc(var(--rail-w) + 8px);
		width: auto;
		max-height: calc(100vh - 16px);
	}
}

@media (max-height: 480px) {
	.top-inner {
		padding-top: 6px;
	}

	.column {
		padding-top: 14px;
	}

	.composer {
		padding: 9px 12px 8px;
	}

	.composer-row {
		margin-top: 4px;
	}

	.send {
		width: 26px;
		height: 26px;
	}

	.approval {
		padding: 10px 12px;
	}

	.approval .kv {
		max-height: 17vh;
		margin-top: 8px;
		padding: 6px 10px;
	}

	.actions {
		margin-top: 8px;
	}

	.rail-list {
		gap: 2px;
		padding-top: 8px;
	}

	.rail-foot {
		padding-bottom: 8px;
	}

	.rail-keys {
		display: none;
	}
}

@media (prefers-reduced-motion: reduce) {
	*,
	*::before,
	*::after {
		animation: none !important;
		transition: none !important;
	}
}
</style>
</head>
<body>
<div class="app">
	<nav class="rail" id="rail" aria-label="Bots">
		<div class="rail-panel">
			<div class="rail-list" id="railList"></div>
			<div class="rail-foot" id="railFoot"></div>
		</div>
	</nav>
	<main class="stage">
		<header class="top">
			<div class="top-inner">
				<button type="button" class="bot-name" id="botName" data-action="settings" aria-haspopup="dialog"></button>
				<div class="meta" id="meta"></div>
				<button type="button" class="detail-btn" id="detailBtn" data-action="detail" title="Quanto ver das tools e da equipe (Ctrl+O)"></button>
				<div id="sheetHost"></div>
			</div>
		</header>
		<div class="scroll" id="scroll">
			<div class="column" id="transcript" aria-live="polite"></div>
		</div>
		<div class="dock">
			<div class="dock-inner">
				<div id="approval"></div>
				<div class="composer" id="composer">
					<div class="queue" id="queue"></div>
					<textarea id="input" rows="1" aria-label="Mensagem"></textarea>
					<div class="composer-row">
						<span class="hint">Enter envia, Shift+Enter quebra a linha</span>
						<button type="button" class="send" id="send" data-action="send" aria-label="Enviar"></button>
					</div>
				</div>
			</div>
		</div>
	</main>
</div>
<script src="data.js"></script>
<script>
const M = window.MIMO;
const LEVELS = ["off", "brief", "full"];
const LEVEL_NAMES = { off: "oculto", brief: "breve", full: "completo" };
const EFFORTS = { low: "baixo", medium: "médio", high: "alto", max: "máximo" };
const STATE_NAMES = { working: "trabalhando", waiting: "esperando aprovação", failed: "falhou", idle: "parado" };
const MODES = {
	normal: { name: "Normal", text: "Pede sua aprovação antes de enviar emails, apagar rotinas e mexer no computador." },
	autonomous: { name: "Autônomo", text: "Age sem pedir aprovação. Você revisa o que ele fez depois." },
};
const ICON = {
	chev: '<svg class="chev" width="10" height="10" viewBox="0 0 10 10"><path d="M3.5 1.8 6.7 5 3.5 8.2" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
	down: '<svg width="10" height="10" viewBox="0 0 10 10"><path d="M1.8 3.5 5 6.7 8.2 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
	check: '<svg width="11" height="11" viewBox="0 0 12 12"><path d="M2.5 6.4 5 8.8 9.5 3.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
	cross: '<svg width="10" height="10" viewBox="0 0 10 10"><path d="M2.5 2.5l5 5m0-5-5 5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
	pause: '<svg width="11" height="11" viewBox="0 0 12 12"><path d="M4 2.5v7M8 2.5v7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>',
	square: '<svg width="8" height="8" viewBox="0 0 8 8"><rect x="1" y="1" width="6" height="6" rx="1.2" fill="currentColor"/></svg>',
	dot: '<svg width="6" height="6" viewBox="0 0 6 6"><circle cx="3" cy="3" r="2.2" fill="currentColor"/></svg>',
	warn: '<svg width="14" height="14" viewBox="0 0 16 16"><path d="M8 2.2 14.3 13.3H1.7Z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/><path d="M8 6.5v3.2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="11.4" r=".85" fill="currentColor"/></svg>',
	hand: '<svg width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="6.3" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6.4 5.6v4.8M9.6 5.6v4.8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
	up: '<svg width="14" height="14" viewBox="0 0 14 14"><path d="M7 11.5V2.8M3 6.5 7 2.5l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
	close: '<svg width="12" height="12" viewBox="0 0 12 12"><path d="M3 3l6 6m0-6-6 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
};

const el = {
	rail: document.getElementById("rail"),
	railList: document.getElementById("railList"),
	railFoot: document.getElementById("railFoot"),
	botName: document.getElementById("botName"),
	meta: document.getElementById("meta"),
	detailBtn: document.getElementById("detailBtn"),
	sheetHost: document.getElementById("sheetHost"),
	scroll: document.getElementById("scroll"),
	transcript: document.getElementById("transcript"),
	approval: document.getElementById("approval"),
	composer: document.getElementById("composer"),
	queue: document.getElementById("queue"),
	input: document.getElementById("input"),
	send: document.getElementById("send"),
};
el.send.innerHTML = ICON.up;

function prepare(source) {
	const bot = structuredClone(source);
	const now = Date.now();
	bot.draft = "";
	bot.open = {};
	bot.timers = [];
	bot.touched = false;
	bot.live.startedAt = now - bot.live.seconds * 1000;
	for (const child of bot.live.team) {
		child.startedAt = now - child.seconds * 1000;
	}
	if (bot.live.turn === "working" && bot.live.tool) {
		bot.lines.push({ kind: "tool", name: bot.live.tool.name, input: bot.live.tool.input, running: true });
	}
	if (bot.live.turn === "waiting" && bot.live.approval) {
		const last = bot.lines[bot.lines.length - 1];
		if (last && last.kind === "tool" && last.name === bot.live.approval.tool && !last.result) {
			last.pending = true;
		}
	}
	return bot;
}

const state = {
	bots: M.bots.map(prepare),
	current: "gemeio",
	level: "brief",
	rail: { hover: false, keys: false, creating: false, name: "", error: "" },
	settings: false,
	folderEdit: false,
	escAt: 0,
};

function esc(text) {
	return String(text ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
}

function current() {
	return state.bots.find((bot) => bot.id === state.current);
}

function busy(bot) {
	return bot.live.turn !== "idle";
}

function stateOf(bot) {
	if (bot.live.failed) {
		return "failed";
	}
	if (bot.live.approval) {
		return "waiting";
	}
	if (busy(bot) || bot.live.team.some((child) => child.state === "working")) {
		return "working";
	}
	return "idle";
}

function modelOf(bot) {
	return M.models.find((model) => model.id === bot.model.id);
}

function initials(name) {
	return name.trim().slice(0, 2).toLowerCase();
}

function since(start) {
	const seconds = Math.max(0, Math.floor((Date.now() - start) / 1000));
	if (seconds < 60) {
		return `${seconds}s`;
	}
	return `${Math.floor(seconds / 60)}min ${String(seconds % 60).padStart(2, "0")}s`;
}

function clock() {
	const now = new Date();
	return `${String(now.getHours()).padStart(2, "0")}:${String(now.getMinutes()).padStart(2, "0")}`;
}

function joined(items) {
	if (items.length <= 1) {
		return items.join("");
	}
	return `${items.slice(0, -1).join(", ")} e ${items[items.length - 1]}`;
}

function unique(items) {
	return [...new Set(items)];
}

function capital(html) {
	return html.charAt(0).toUpperCase() + html.slice(1);
}

function plain(html) {
	const box = document.createElement("div");
	box.innerHTML = html;
	return box.textContent.replace(/\s+/g, " ").trim();
}

function peek(input) {
	const value = Object.values(input || {})[0];
	if (value === undefined) {
		return "";
	}
	return typeof value === "string" ? value : JSON.stringify(value);
}

function isOpen(bot, key) {
	if (key in bot.open) {
		return bot.open[key];
	}
	return state.level === "full";
}

function items(bot) {
	const out = [];
	let group = null;
	bot.lines.forEach((line, index) => {
		if (line.kind === "tool" || line.kind === "team" || line.kind === "approval") {
			if (!group) {
				group = { kind: "group", key: `g${index}`, lines: [] };
				out.push(group);
			}
			group.lines.push(line);
			return;
		}
		group = null;
		out.push({ kind: line.kind, key: `l${index}`, line, last: index === bot.lines.length - 1 });
	});
	if (busy(bot)) {
		const last = out[out.length - 1];
		const trailing = last && last.kind === "group" ? out.pop() : null;
		out.push({ kind: "live", key: "live", lines: trailing ? trailing.lines : [] });
	}
	if (bot.live.team.length && (busy(bot) || bot.live.team.some((child) => child.state === "working"))) {
		out.push({ kind: "crew", key: "crew" });
	}
	return out;
}

function kvHTML(input) {
	const entries = Object.entries(input || {});
	if (!entries.length) {
		return "";
	}
	return `<dl class="kv">${entries.map(([key, value]) => `<dt>${esc(key)}</dt><dd>${esc(typeof value === "string" ? value : JSON.stringify(value))}</dd>`).join("")}</dl>`;
}

function toolStatus(line) {
	if (line.running) {
		return { glyph: '<span class="spin"></span>', tone: "", text: "rodando" };
	}
	if (line.pending) {
		return { glyph: ICON.pause, tone: "wait", text: "espera sua aprovação" };
	}
	if (line.stopped) {
		return { glyph: ICON.square, tone: "", text: "interrompido" };
	}
	if (line.denied) {
		return { glyph: ICON.cross, tone: "", text: "negado" };
	}
	if (line.failed) {
		return { glyph: ICON.cross, tone: "bad", text: "falhou" };
	}
	if (line.result) {
		return { glyph: ICON.check, tone: "ok", text: "" };
	}
	return { glyph: ICON.dot, tone: "", text: "" };
}

function stepHTML(line, full) {
	if (line.kind === "team") {
		const task = line.verb === "delegou para" && line.task ? `: ${esc(line.task)}` : "";
		return `<div class="step step-team"><span class="chip">${esc(line.bot.charAt(0))}</span><span>${esc(capital(line.verb))} <b>${esc(line.bot)}</b>${task}</span></div>`;
	}
	if (line.kind === "approval") {
		const approved = line.outcome === "approved";
		return `<div class="step"><div class="step-head"><span class="glyph ${approved ? "ok" : ""}">${approved ? ICON.check : ICON.cross}</span><span>Você ${approved ? "aprovou" : "negou"} <code class="tname">${esc(line.tool)}</code></span></div>${full ? kvHTML(line.input) : ""}</div>`;
	}
	const status = toolStatus(line);
	const head = `<div class="step-head"><span class="glyph ${status.tone}">${status.glyph}</span><code class="tname">${esc(line.name)}</code>${full ? "" : `<span class="peek">${esc(peek(line.input))}</span>`}${status.text ? `<span class="st ${status.tone}">${status.text}</span>` : ""}</div>`;
	const fail = line.failed ? `<p class="fail">${esc(line.failed)}</p>` : "";
	const body = full ? `${kvHTML(line.input)}${line.result ? `<pre class="result">${esc(line.result)}</pre>` : ""}` : "";
	return `<div class="step">${head}${fail}${body}</div>`;
}

function stepsHTML(lines) {
	return `<div class="steps">${lines.map((line) => stepHTML(line, state.level === "full")).join("")}</div>`;
}

function summaryHTML(lines) {
	const tools = lines.filter((line) => line.kind === "tool");
	const team = lines.filter((line) => line.kind === "team");
	const approvals = lines.filter((line) => line.kind === "approval");
	const parts = [];
	const delegated = unique(team.filter((line) => line.verb === "delegou para").map((line) => line.bot));
	const created = unique(team.filter((line) => line.verb === "criou").map((line) => line.bot));
	if (delegated.length) {
		parts.push(`delegou para ${joined(delegated.map((name) => `<b>${esc(name)}</b>`))}`);
	} else if (created.length) {
		parts.push(`criou ${joined(created.map((name) => `<b>${esc(name)}</b>`))}`);
	}
	const used = unique(tools.filter((line) => !line.denied && !line.stopped).map((line) => line.name));
	if (used.length) {
		parts.push(`usou ${used.length <= 2 ? joined(used.map((name) => `<code>${esc(name)}</code>`)) : `${used.length} tools`}`);
	}
	if (approvals.some((line) => line.outcome === "approved")) {
		parts.push("com sua aprovação");
	}
	const denied = unique(approvals.filter((line) => line.outcome === "denied").map((line) => line.tool));
	if (denied.length) {
		parts.push(`você negou ${joined(denied.map((name) => `<code>${esc(name)}</code>`))}`);
	}
	const failed = tools.filter((line) => line.failed).length;
	if (failed) {
		parts.push(`<span class="bad">${failed === 1 ? "1 falhou" : `${failed} falharam`}</span>`);
	}
	const stopped = unique(tools.filter((line) => line.stopped).map((line) => line.name));
	if (stopped.length) {
		parts.push(`${joined(stopped.map((name) => `<code>${esc(name)}</code>`))} interrompido`);
	}
	const ms = tools.reduce((sum, line) => sum + (line.ms || 0), 0);
	const time = ms && !stopped.length ? ` em ${Math.max(1, Math.round(ms / 1000))}s` : "";
	return capital(parts.join(", ")) + time;
}

function foldHTML(key, open, inner, extra = "") {
	return `<button type="button" class="fold${extra}" data-action="toggle" data-key="${key}" aria-expanded="${open}">${inner}${ICON.chev}</button>`;
}

function liveLabel(bot) {
	const live = bot.live;
	if (live.turn === "thinking") {
		return "Pensando";
	}
	if (live.turn === "waiting") {
		return `Esperando sua aprovação para <code>${esc(live.approval.tool)}</code>`;
	}
	if (live.turn === "responding") {
		return "Escrevendo a resposta";
	}
	return live.tool ? `Trabalhando em <code>${esc(live.tool.name)}</code>` : "Trabalhando";
}

function liveHTML(bot, item) {
	const armed = Date.now() - state.escAt < 1000;
	const inner = `<span class="beacon" data-turn="${bot.live.turn}"></span><span>${liveLabel(bot)}</span><span class="timer" data-since="${bot.live.startedAt}">${since(bot.live.startedAt)}</span>`;
	const open = item.lines.length > 0 && isOpen(bot, "live");
	const head = item.lines.length ? foldHTML("live", open, inner) : `<div class="fold">${inner}</div>`;
	const stop = `<button type="button" class="stop${armed ? " armed" : ""}" data-action="stop" title="Parar o Turno (Esc duas vezes)">${armed ? "Esc de novo para parar" : "Parar"}</button>`;
	return `<div class="live"><div class="live-row">${head}${stop}</div>${open ? stepsHTML(item.lines) : ""}</div>`;
}

function crewHTML(bot) {
	const rows = bot.live.team.map((child) => {
		const status = child.state === "done"
			? `<span class="crew-st done">${ICON.check}terminou</span>`
			: `<span class="crew-st"><span class="beacon small"></span>${child.tool ? `<code>${esc(child.tool)}</code>` : "trabalhando"}<span class="timer" data-since="${child.startedAt}">${since(child.startedAt)}</span></span>`;
		return `<div class="crew-row"><span class="chip">${esc(child.name.charAt(0))}</span><b>${esc(child.name)}</b><span class="crew-task">${esc(child.task)}</span>${status}</div>`;
	});
	return `<div class="crew"><p class="crew-title">Equipe de ${esc(bot.name)}</p>${rows.join("")}</div>`;
}

function itemHTML(bot, item) {
	const line = item.line;
	const off = state.level === "off";
	switch (item.kind) {
		case "you":
			return `<p class="you">${esc(line.text)}</p>`;
		case "reply":
			if (!line.html) {
				return "";
			}
			return `<div class="reply${line.streaming ? " streaming" : ""}">${line.html.replace(/<a /g, '<a target="_blank" rel="noreferrer" ')}</div>`;
		case "group": {
			if (off) {
				return "";
			}
			const open = isOpen(bot, item.key);
			return `<div class="group">${foldHTML(item.key, open, `<span>${summaryHTML(item.lines)}</span>`)}${open ? stepsHTML(item.lines) : ""}</div>`;
		}
		case "note": {
			const open = isOpen(bot, item.key);
			return `<div class="note">${foldHTML(item.key, open, `<span class="chip">${esc(line.from.charAt(0))}</span><span>${esc(line.text)}</span>`)}${open ? `<p class="note-body">${esc(line.detail)}</p>` : ""}</div>`;
		}
		case "summary": {
			if (off) {
				return "";
			}
			const open = isOpen(bot, item.key);
			return `<div class="summary"><button type="button" class="divider" data-action="toggle" data-key="${item.key}" aria-expanded="${open}">Resumo do que veio antes</button>${open ? `<p class="summary-text">${esc(line.text)}</p>` : ""}</div>`;
		}
		case "routine": {
			if (off) {
				return "";
			}
			const open = isOpen(bot, item.key);
			return `<div class="routine">${foldHTML(item.key, open, `<span>Rotina <b>${esc(line.name)}</b> disparou</span>`)}${open ? `<p class="routine-prompt">${esc(line.prompt)}</p>` : ""}</div>`;
		}
		case "warning":
			return `<p class="warn">${ICON.warn}<span>${esc(line.text)}</span></p>`;
		case "error": {
			const hint = item.last && bot.live.failed ? '<p class="err-hint">Escreva de novo para tentar outra vez.</p>' : "";
			return `<div class="err"><p class="err-title">A resposta falhou</p><p class="err-msg">${esc(line.text)}</p>${hint}</div>`;
		}
		case "stopped": {
			const dropped = line.dropped === 1 ? " A mensagem da fila foi descartada." : line.dropped > 1 ? ` As ${line.dropped} mensagens da fila foram descartadas.` : "";
			return `<p class="stopped">Interrompido.${dropped}</p>`;
		}
		case "live":
			return liveHTML(bot, item);
		case "crew":
			return crewHTML(bot);
		default:
			return "";
	}
}

function emptyHTML(bot) {
	const groups = M.toolGroups.filter((group) => bot.tools.includes(group.id));
	const can = groups.length
		? `<p class="empty-sub">O que ${esc(bot.name)} pode usar</p><ul class="can">${groups.map((group) => `<li><span>${esc(group.label)}</span><span>${esc(group.hint)}</span></li>`).join("")}</ul>`
		: `<p class="empty-sub">${esc(bot.name)} está sem Grupos de tools. Por enquanto só conversa.</p>`;
	const folder = bot.tools.includes("computer") && !bot.folder ? " Sem Pasta, o computador roda a partir da sua pasta pessoal." : "";
	return `<div class="empty"><div class="empty-mark">${esc(initials(bot.name))}</div><h1>${esc(bot.name)}</h1><p class="empty-lead">Ainda sem conversa. Escreva abaixo para começar.</p>${can}<p class="empty-mode">Modo ${esc(MODES[bot.mode].name.toLowerCase())}: ${esc(MODES[bot.mode].text.charAt(0).toLowerCase() + MODES[bot.mode].text.slice(1))}${folder} <button type="button" class="link" data-action="settings">Mudar nos ajustes</button></p></div>`;
}

function renderTranscript(options = {}) {
	const bot = current();
	const active = document.activeElement;
	const keep = active && el.transcript.contains(active) ? active.dataset.key : null;
	const top = el.scroll.scrollTop;
	const near = el.scroll.scrollHeight - el.scroll.scrollTop - el.scroll.clientHeight < 140;
	const html = bot.lines.length === 0 && !busy(bot) ? emptyHTML(bot) : items(bot).map((item) => itemHTML(bot, item)).join("");
	el.transcript.innerHTML = html;
	if (keep) {
		el.transcript.querySelector(`[data-key="${keep}"]`)?.focus({ preventScroll: true });
	}
	if (options.bottom || (near && !options.keepScroll)) {
		el.scroll.scrollTop = el.scroll.scrollHeight;
	} else {
		el.scroll.scrollTop = top;
	}
}

function subOf(bot, status) {
	const live = bot.live;
	if (status === "waiting") {
		return `Quer usar ${live.approval.tool}`;
	}
	if (status === "failed") {
		return bot.preview || "A última resposta falhou";
	}
	if (status === "working") {
		if (live.turn === "thinking") {
			return "Pensando";
		}
		if (live.turn === "responding") {
			return "Escrevendo a resposta";
		}
		if (live.turn === "working") {
			return live.tool ? `Trabalhando em ${live.tool.name}` : "Trabalhando";
		}
		return "A equipe está trabalhando";
	}
	if (bot.touched) {
		const last = [...bot.lines].reverse().find((line) => line.kind === "reply" || line.kind === "you" || line.kind === "stopped");
		if (last) {
			return last.kind === "reply" ? plain(last.html) : last.kind === "stopped" ? "Interrompido." : last.text;
		}
	}
	return bot.preview || "Ainda sem conversa";
}

function renderRailList() {
	const ids = state.bots.map((bot) => bot.id).join(",");
	if (el.railList.dataset.ids !== ids) {
		el.railList.innerHTML = state.bots.map((bot) => `<button type="button" class="bot-item" data-action="pick" data-id="${esc(bot.id)}"><span class="mark">${esc(initials(bot.name))}<span class="dot"></span></span><span class="bot-text"><span class="bot-line"><span class="bot-name-text">${esc(bot.name)}</span><span class="bot-time"></span></span><span class="bot-sub"></span></span></button>`).join("");
		el.railList.dataset.ids = ids;
	}
	for (const bot of state.bots) {
		const item = el.railList.querySelector(`[data-id="${CSS.escape(bot.id)}"]`);
		const status = stateOf(bot);
		item.setAttribute("aria-current", String(bot.id === state.current));
		item.setAttribute("aria-label", `${bot.name}, ${STATE_NAMES[status]}`);
		item.querySelector(".dot").dataset.state = status;
		const sub = item.querySelector(".bot-sub");
		sub.dataset.state = status;
		sub.textContent = subOf(bot, status);
		item.querySelector(".bot-time").textContent = bot.lastAt || "";
	}
}

function renderRailFoot() {

	const form = rail.creating

		: `<button type="button" class="bot-item" data-action="new" aria-label="Novo bot"><span class="mark plus">+</span><span class="bot-text"><span class="bot-name-text">Novo bot</span></span></button>`;
	el.railFoot.innerHTML = `${form}<p class="rail-keys">Ctrl+E abre esta lista, ↑↓ troca</p>`;
}

function syncRail() {
	const rail = state.rail;
	el.rail.classList.toggle("open", rail.hover || rail.keys || rail.creating);
}

function renderTop() {
	const bot = current();
	const model = modelOf(bot);
	const meta = [`${model ? model.label : bot.model.id}, ${EFFORTS[bot.model.effort] || bot.model.effort}`];
	if (bot.mode === "autonomous") {
		meta.push("autônomo");
	}

		meta.push(bot.folder);
	}

	const bars = [0, 1, 2].map((index) => `<i class="${index <= level ? "on" : ""}"></i>`).join("");

	el.botName.title = `Ajustes de ${bot.name}`;
	el.botName.setAttribute("aria-expanded", String(state.settings));
	el.meta.innerHTML = meta.map((part) => `<span>${esc(part)}</span>`).join("");
	el.detailBtn.innerHTML = `<span class="levels" aria-hidden="true">${bars}</span><span>Detalhe <b>${LEVEL_NAMES[state.level]}</b></span>`;
}

function renderSettings(entering) {
	if (!state.settings) {
		el.sheetHost.innerHTML = "";
		return;
	}

	el.sheetHost.innerHTML = settingsHTML(current());

function settingsHTML(bot) {
	const model = modelOf(bot);
	const models = M.models.map((entry) => `<button type="button" class="opt" role="radio" aria-checked="${entry.id === bot.model.id}" data-action="model" data-id="${entry.id}"><span>${esc(entry.label)}</span>${entry.id === bot.model.id ? ICON.check : ""}</button>`).join("");
	const efforts = model.efforts.map((effort) => `<button type="button" aria-pressed="${effort === bot.model.effort}" data-action="effort" data-id="${effort}">${EFFORTS[effort]}</button>`).join("");
	const modes = Object.entries(MODES).map(([id, mode]) => `<button type="button" aria-pressed="${id === bot.mode}" data-action="mode" data-id="${id}">${mode.name}</button>`).join("");
	const groups = M.toolGroups.map((group) => `<button type="button" class="toggle" role="switch" aria-checked="${bot.tools.includes(group.id)}" data-action="tool" data-id="${group.id}"><span class="tg-text"><span>${esc(group.label)}</span><span class="tg-hint">${esc(group.hint)}</span></span><span class="switch"></span></button>`).join("");
	let folder;
	if (state.folderEdit) {
		folder = `<input class="field" id="folderField" value="${esc(bot.folder || "~/")}" aria-label="Caminho da Pasta" spellcheck="false"><p class="explain">Enter salva, Esc cancela.</p>`;
	} else if (bot.folder) {
		folder = `<div class="folder"><code class="path">${esc(bot.folder)}</code><button type="button" class="link" data-action="folder-edit">Trocar</button><button type="button" class="link" data-action="folder-clear">Tirar</button></div>`;
	} else {
		folder = `<div class="folder"><span>Nenhuma. O computador roda a partir da sua pasta pessoal.</span><button type="button" class="link" data-action="folder-edit">Escolher Pasta</button></div>`;
	}
	const folderNote = bot.tools.includes("computer") ? "" : '<p class="explain">Só vale com o grupo Computador ligado.</p>';
	const memory = bot.memories === 0 ? "Nenhuma memória ainda" : bot.memories === 1 ? "1 memória guardada" : `${bot.memories} memórias guardadas`;
	return `<div class="sheet" id="sheet" role="dialog" aria-label="Ajustes de ${esc(bot.name)}">
		<div class="sheet-head"><p class="sheet-title">Ajustes de ${esc(bot.name)}</p><button type="button" class="icon-btn" data-action="settings-close" aria-label="Fechar">${ICON.close}</button></div>
		<section><h3>Modelo</h3><div role="radiogroup" aria-label="Modelo">${models}</div><div class="row"><span>Esforço</span><div class="seg" role="group" aria-label="Esforço">${efforts}</div></div><p class="explain">Vale a partir da próxima resposta.</p></section>
		<section><div class="row" style="margin-top:0"><h3 style="margin:0">Modo</h3><div class="seg" role="group" aria-label="Modo">${modes}</div></div><p class="explain">${esc(MODES[bot.mode].text)}</p></section>
		<section><h3>Grupos de tools</h3>${groups}</section>
		<section><h3>Pasta</h3>${folder}${folderNote}</section>
		<section><h3>Memória</h3><p class="memory">${memory}<span>${esc(bot.name)} guarda sozinho fatos e preferências que valem para as próximas conversas.</span></p></section>
	</div>`;
}

function renderDock() {
	const bot = current();
	const approval = bot.live.approval;
	if (approval) {
		const mark = `${bot.id}:${approval.tool}`;
		if (el.approval.dataset.mark !== mark) {
			el.approval.innerHTML = `<section class="approval" aria-label="Aprovação"><div class="approval-head">${ICON.hand}<span><b>${esc(bot.name)}</b> quer usar <code>${esc(approval.tool)}</code></span></div>${kvHTML(approval.input)}<div class="actions"><button type="button" class="btn primary" data-action="approve">Aprovar <kbd>1</kbd></button><button type="button" class="btn ghost" data-action="deny">Negar <kbd>2</kbd></button></div></section>`;
			el.approval.dataset.mark = mark;
		}
	} else if (el.approval.dataset.mark) {
		el.approval.innerHTML = "";
		el.approval.dataset.mark = "";
	}
	el.queue.innerHTML = bot.live.queue.map((text, index) => `<div class="queued"><span class="ql">Na fila</span><p title="${esc(text)}">${esc(text)}</p><button type="button" data-action="unqueue" data-index="${index}">Tirar</button></div>`).join("");
	el.input.placeholder = busy(bot) ? `Escreva; entra na fila até ${bot.name} terminar` : `Escreva para ${bot.name}`;
	el.send.disabled = !el.input.value.trim();
	el.send.setAttribute("aria-label", busy(bot) ? "Pôr na fila" : "Enviar");
	el.send.title = busy(bot) ? "Pôr na fila (Enter)" : "Enviar (Enter)";
}

function render(options = {}) {
	renderRailList();
	renderTop();
	renderTranscript(options);
	renderDock();
}

function tick() {
	for (const node of document.querySelectorAll("[data-since]")) {
		node.textContent = since(Number(node.dataset.since));
	}
}

function autosize() {
	el.input.style.height = "auto";
	el.input.style.height = `${el.input.scrollHeight}px`;
}

function schedule(bot, ms, run) {
	const id = setTimeout(() => {
		bot.timers = bot.timers.filter((timer) => timer !== id);
		run();
		render();
	}, ms);
	bot.timers.push(id);
}

function startTurn(bot) {
	bot.live.turn = "thinking";
	bot.live.startedAt = Date.now();
	bot.live.tool = null;
	schedule(bot, M.demoTurn.thinkingMs, () => runStep(bot, 0));
}

function runStep(bot, index) {
	const steps = M.demoTurn.steps;
	if (index >= steps.length) {
		streamReply(bot, M.demoTurn.replyBlocks);
		return;
	}
	const step = steps[index];
	const line = { kind: "tool", name: step.name, input: step.input, running: true };
	bot.lines.push(line);
	bot.live.turn = "working";
	bot.live.tool = { name: step.name, input: step.input };
	schedule(bot, step.ms, () => {
		line.running = false;
		line.result = step.result;
		line.ms = step.ms;
		runStep(bot, index + 1);
	});
}

function streamReply(bot, blocks) {
	bot.live.turn = "responding";
	bot.live.tool = null;
	const line = { kind: "reply", html: "", streaming: true };
	bot.lines.push(line);
	const next = (index) => {
		line.html += blocks[index];
		if (index + 1 < blocks.length) {
			schedule(bot, M.demoTurn.blockMs, () => next(index + 1));
			return;
		}
		schedule(bot, M.demoTurn.blockMs, () => finish(bot, line));
	};
	schedule(bot, M.demoTurn.blockMs, () => next(0));
}

function finish(bot, line) {
	line.streaming = false;
	bot.live.turn = "idle";
	bot.live.tool = null;
	bot.lastAt = clock();
	if (bot.live.queue.length) {
		for (const text of bot.live.queue.splice(0)) {
			bot.lines.push({ kind: "you", text });
		}
		startTurn(bot);
	}
}

function stop(bot) {
	if (!busy(bot)) {
		return;
	}
	for (const timer of bot.timers) {
		clearTimeout(timer);
	}
	bot.timers = [];
	for (const line of bot.lines) {
		if (line.running || line.pending) {
			line.running = false;
			line.pending = false;
			line.stopped = true;
		}
		if (line.streaming) {
			line.streaming = false;
		}
	}
	const dropped = bot.live.queue.length;
	bot.live.queue = [];
	bot.live.approval = null;
	bot.live.turn = "idle";
	bot.live.tool = null;
	bot.touched = true;
	bot.lines.push({ kind: "stopped", dropped });
	state.escAt = 0;
	render({ bottom: true });
}

function resolve(bot, approved) {
	const approval = bot.live.approval;
	if (!approval) {
		return;
	}
	const line = [...bot.lines].reverse().find((entry) => entry.pending);
	bot.live.approval = null;
	bot.touched = true;
	const record = { kind: "approval", tool: approval.tool, input: approval.input, outcome: approved ? "approved" : "denied" };
	if (line) {
		line.pending = false;
		bot.lines.splice(bot.lines.indexOf(line), 0, record);
	} else {
		bot.lines.push(record);
	}
	if (approved) {
		bot.live.turn = "working";
		bot.live.tool = { name: approval.tool, input: approval.input };
		if (line) {
			line.running = true;
		}
		schedule(bot, 800, () => {
			if (line) {
				line.running = false;
				line.result = M.approvalOutcomes.approved.result;
			}
			streamReply(bot, [M.approvalOutcomes.approved.replyHtml]);
		});
	} else {
		if (line) {
			line.denied = true;
		}
		bot.live.turn = "thinking";
		bot.live.tool = null;
		schedule(bot, 600, () => streamReply(bot, [M.approvalOutcomes.denied.replyHtml]));
	}
	render({ bottom: true });
	el.input.focus();
}

function send() {
	const bot = current();
	const text = el.input.value.trim();
	if (!text) {
		return;
	}
	el.input.value = "";
	bot.draft = "";
	autosize();
	bot.touched = true;
	if (busy(bot)) {
		bot.live.queue.push(text);
		render({ bottom: true });
		return;
	}
	bot.live.failed = null;
	bot.lastAt = clock();
	bot.lines.push({ kind: "you", text });
	startTurn(bot);
	render({ bottom: true });
}

function pick(id, keepFocus) {
	if (id === state.current) {
		return;
	}
	current().draft = el.input.value;
	state.current = id;
	state.settings = false;
	state.folderEdit = false;
	el.input.value = current().draft;
	autosize();
	renderSettings(false);
	render({ bottom: true });
	if (!keepFocus) {
		el.input.focus();
	}
}

function focusRailCurrent() {
	el.railList.querySelector(`[data-id="${CSS.escape(state.current)}"]`)?.focus();
}

function enterRail() {
	state.rail.keys = true;
	syncRail();
	focusRailCurrent();
}

function leaveRail() {
	state.rail.keys = false;
	syncRail();
	el.input.focus();
}

function cycleDetail() {
	state.level = LEVELS[(LEVELS.indexOf(state.level) + 1) % LEVELS.length];
	for (const bot of state.bots) {
		bot.open = {};
	}
	renderTop();
	renderTranscript({ keepScroll: true });
}

function openSettings(open) {
	state.settings = open;
	state.folderEdit = false;
	renderTop();
	renderSettings(open);
	if (open) {
		document.querySelector("#sheet .opt[aria-checked='true']")?.focus();
	} else {
		el.botName.focus();
	}
}

function refreshSettings(focusSelector) {
	renderTop();
	renderSettings(false);
	if (focusSelector) {
		document.querySelector(focusSelector)?.focus();
	}
}

function startCreate() {
	state.rail.creating = true;
	state.rail.name = "";
	state.rail.error = "";
	syncRail();
	renderRailFoot();
	document.getElementById("newName").focus();
}

function stopCreate(focusInput) {
	state.rail.creating = false;
	state.rail.error = "";
	state.rail.name = "";
	syncRail();
	renderRailFoot();
	if (focusInput) {
		el.input.focus();
	}
}

function createBot() {
	const name = state.rail.name.trim();
	if (!name) {
		state.rail.error = "Dê um nome ao bot.";
	} else if (state.bots.some((bot) => bot.name.toLowerCase() === name.toLowerCase())) {
		state.rail.error = "Já existe um bot com esse nome.";
	} else {
		state.rail.error = "";
	}
	if (state.rail.error) {
		const hint = el.railFoot.querySelector(".create-hint");
		hint.textContent = state.rail.error;
		hint.classList.add("bad");
		return;
	}
	const bot = prepare({
		id: `bot-${Date.now()}`,
		name,
		model: { id: "gpt-5.6-luna", effort: "max" },
		mode: "autonomous",
		tools: M.toolGroups.map((group) => group.id),
		folder: null,
		memories: 0,
		lastAt: null,
		preview: null,
		live: { turn: "idle", seconds: 0, approval: null, queue: [], team: [], failed: null },
		lines: [],
	});
	state.bots.push(bot);
	state.rail.hover = false;
	stopCreate(false);
	pick(bot.id);
}

const actions = {
	pick: (node) => {
		pick(node.dataset.id);
		state.rail.keys = false;
		syncRail();
	},
	new: () => startCreate(),
	toggle: (node) => {
		const bot = current();
		const key = node.dataset.key;
		bot.open[key] = !isOpen(bot, key);
		renderTranscript({ keepScroll: true });
	},
	stop: () => stop(current()),
	approve: () => resolve(current(), true),
	deny: () => resolve(current(), false),
	detail: () => cycleDetail(),
	settings: () => openSettings(!state.settings),
	"settings-close": () => openSettings(false),
	send: () => {
		send();
		el.input.focus();
	},
	unqueue: (node) => {
		current().live.queue.splice(Number(node.dataset.index), 1);
		renderDock();
		el.input.focus();
	},
	model: (node) => {
		const bot = current();
		const model = M.models.find((entry) => entry.id === node.dataset.id);
		bot.model.id = model.id;
		if (!model.efforts.includes(bot.model.effort)) {
			bot.model.effort = model.efforts[model.efforts.length - 1];
		}
		refreshSettings(`#sheet [data-action="model"][data-id="${model.id}"]`);
	},
	effort: (node) => {
		current().model.effort = node.dataset.id;
		refreshSettings(`#sheet [data-action="effort"][data-id="${node.dataset.id}"]`);
	},
	mode: (node) => {
		current().mode = node.dataset.id;
		refreshSettings(`#sheet [data-action="mode"][data-id="${node.dataset.id}"]`);
		if (!current().lines.length) {
			renderTranscript();
		}
	},
	tool: (node) => {
		const bot = current();
		const id = node.dataset.id;
		bot.tools = bot.tools.includes(id) ? bot.tools.filter((tool) => tool !== id) : M.toolGroups.map((group) => group.id).filter((tool) => tool === id || bot.tools.includes(tool));
		refreshSettings(`#sheet [data-action="tool"][data-id="${id}"]`);
		if (!bot.lines.length) {
			renderTranscript();
		}
	},
	"folder-edit": () => {
		state.folderEdit = true;
		refreshSettings("#folderField");
		const field = document.getElementById("folderField");
		field.setSelectionRange(field.value.length, field.value.length);
	},
	"folder-clear": () => {
		current().folder = null;
		refreshSettings('#sheet [data-action="folder-edit"]');
	},
};

document.addEventListener("click", (event) => {
	const node = event.target.closest("[data-action]");
	if (node && actions[node.dataset.action]) {
		actions[node.dataset.action](node, event);
		return;
	}
	if (event.target.closest("#composer") && !event.target.closest("button")) {
		el.input.focus();
	}
});

document.addEventListener("mousedown", (event) => {
	if (state.settings && !event.target.closest("#sheet") && !event.target.closest(".bot-name")) {
		state.settings = false;
		state.folderEdit = false;
		renderTop();
		renderSettings(false);
	}
});

document.addEventListener("submit", (event) => {
	event.preventDefault();
	if (event.target.id === "createForm") {
		createBot();
	}
});

document.addEventListener("input", (event) => {
	if (event.target.id === "newName") {
		state.rail.name = event.target.value;
		if (state.rail.error) {
			state.rail.error = "";
			const hint = el.railFoot.querySelector(".create-hint");
			hint.textContent = "Enter cria, Esc cancela";
			hint.classList.remove("bad");
		}
	}
});

el.input.addEventListener("input", () => {
	autosize();
	current().draft = el.input.value;
	el.send.disabled = !el.input.value.trim();
});

el.input.addEventListener("keydown", (event) => {
	if (event.key === "Enter" && !event.shiftKey && !event.isComposing) {
		event.preventDefault();
		send();
	}
});

let hoverTimer = 0;
el.rail.addEventListener("mouseenter", () => {
	hoverTimer = setTimeout(() => {
		state.rail.hover = true;
		syncRail();
	}, 140);
});
el.rail.addEventListener("mouseleave", () => {
	clearTimeout(hoverTimer);
	state.rail.hover = false;
	syncRail();
});
el.rail.addEventListener("focusout", (event) => {
	if (el.rail.contains(event.relatedTarget)) {
		return;
	}
	state.rail.keys = false;
	if (state.rail.creating && !state.rail.name.trim()) {
		stopCreate(false);
	}
	syncRail();
});

el.rail.addEventListener("keydown", (event) => {
	if (event.target.id === "newName") {
		if (event.key === "Escape") {
			event.preventDefault();
			event.stopPropagation();
			stopCreate(true);
		}
		return;
	}
	const index = state.bots.findIndex((bot) => bot.id === state.current);
	if (event.key === "ArrowDown" || event.key === "ArrowUp") {
		event.preventDefault();
		const next = Math.min(state.bots.length - 1, Math.max(0, index + (event.key === "ArrowDown" ? 1 : -1)));
		state.rail.keys = true;
		syncRail();
		pick(state.bots[next].id, true);
		focusRailCurrent();
		return;
	}
	if ((event.key === "Enter" || event.key === "Escape") && event.target.closest("#railList")) {
		event.preventDefault();
		event.stopPropagation();
		leaveRail();
	}
});

document.addEventListener("keydown", (event) => {
	const key = event.key.toLowerCase();
	const target = event.target;
	const typing = target.matches && target.matches("input, textarea");
	if (event.ctrlKey && !event.altKey && !event.metaKey && key === "o") {
		event.preventDefault();
		cycleDetail();
		return;
	}
	if (event.ctrlKey && !event.altKey && !event.metaKey && key === "e") {
		event.preventDefault();
		if (el.rail.contains(document.activeElement) && !state.rail.creating) {
			leaveRail();
		} else {
			if (state.settings) {
				openSettings(false);
			}
			enterRail();
		}
		return;
	}
	if (target.id === "folderField") {
		if (event.key === "Enter") {
			event.preventDefault();
			current().folder = target.value.trim() || null;
			state.folderEdit = false;
			refreshSettings('#sheet [data-action="folder-edit"]');
			document.querySelector('#sheet [data-action="folder-edit"]')?.focus();
		} else if (event.key === "Escape") {
			event.preventDefault();
			state.folderEdit = false;
			refreshSettings('#sheet [data-action="folder-edit"]');
		}
		return;
	}
	if (event.key === "Escape") {
		if (state.settings) {
			event.preventDefault();
			openSettings(false);
			return;
		}
		const bot = current();
		if (!busy(bot)) {
			return;
		}
		event.preventDefault();
		if (Date.now() - state.escAt < 1000) {
			stop(bot);
			return;
		}
		state.escAt = Date.now();
		renderTranscript();
		setTimeout(() => {
			if (state.escAt && Date.now() - state.escAt >= 1000) {
				state.escAt = 0;
				renderTranscript();
			}
		}, 1050);
		return;
	}
	const bot = current();
	if ((event.key === "1" || event.key === "2") && !event.ctrlKey && !event.altKey && !event.metaKey && bot.live.approval && !state.settings) {
		if (!typing || (target === el.input && el.input.value === "")) {
			event.preventDefault();
			resolve(bot, event.key === "1");
			return;
		}
	}
	if (!typing && target === document.body && event.key.length === 1 && !event.ctrlKey && !event.metaKey && !event.altKey) {
		el.input.focus();
	}
});

window.addEventListener("resize", autosize);
setInterval(tick, 1000);

renderRailFoot();
render({ bottom: true });
el.input.focus();
</script>
</body>
</html>
