<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Portal de demonstração</title>
<style>body{font:18px system-ui;background:#f4f3ef;color:#282823;max-width:860px;margin:64px auto;padding:24px}nav{display:flex;gap:24px}a{color:#225c47}main{margin-top:48px}button,input{font:inherit;padding:12px;margin:8px}section{padding:24px;background:white;border-radius:12px}label{display:block}</style>
<nav id="nav"></nav><main id="content"></main><script>
const links=[['Início','#inicio'],['Faturas','#faturas'],['Suporte','#suporte']];
const order=Number(new URLSearchParams(location.search).get('order')||0)%3;
document.querySelector('#nav').innerHTML=[...links.slice(order),...links.slice(0,order)].map(([name,url])=>`<a href="${url}">${name}</a>`).join('');
function render(){const route=location.hash;document.title=route==='#faturas'?'Faturas fictícias':'Portal de demonstração';document.querySelector('#content').innerHTML=route==='#faturas'?'<h1>Faturas fictícias</h1><section><p>Escolha o mês para consultar os detalhes.</p><p><a href="#julho">Julho de 2026</a></p><p><a href="#agosto">Agosto de 2026</a></p><p><a href="#setembro">Setembro de 2026</a></p></section>':route==='#agosto'?'<h1>Detalhes da fatura de agosto de 2026</h1><section><p>Fatura DEMO-0826, valor fictício de R$ 148,00.</p><p>Status: disponível para consulta.</p><button type="button" onclick="document.body.dataset.paid=\'true\'">Pagar fatura</button></section>':route==='#suporte'?'<h1>Suporte fictício</h1><form><label>Assunto<input name="Assunto" aria-label="Assunto" type="text"></label><label>Mensagem<textarea name="Mensagem" aria-label="Mensagem"></textarea></label><label>Senha<input type="password" name="password" value="secret-never-send"></label><button type="submit">Enviar</button></form>':'<h1>Portal de demonstração</h1><section><p>Dados fictícios para testar a navegação.</p><p>Consulte faturas ou preencha o formulário de suporte sem enviá-lo.</p></section>'}
window.addEventListener('hashchange',render);render();
</script></html>
